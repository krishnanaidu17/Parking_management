<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Bootstrap naviagtions</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="bg-dark text-white">
    <div class="car">
        <i class="bi bi-car-front"></i>
    </div>
    <div class="header">
        <h4>simple parking management system</h4><hr>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-6 col-md-4 mt-5">
                <div class="card p-3">
                    <i class="bi bi-box-arrow-in-right text-dark iconz"></i>
                    <div class="card-body">
                        <h5 class="mb-4 text-dark text-center">Admin Login</h5>
                            <div class="mb-4 text-left">
                                <label class="text-dark">Username</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="mb-4 text-left">
                                <label class="text-dark">Password</label>
                                <input type="password" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-custom btn-block w-100">login</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
  </body>
